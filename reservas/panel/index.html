<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de reservas | URBAN FOOD</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" href="../../assets/brand/faviconr.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "deep-black": "#000000",
              "vibrant-orange": "#FF6B00",
              "fresh-teal": "#1ABC9C",
              "warm-gold": "#F39C12",
              "background": "#f9f9f9",
              "surface": "#f9f9f9",
              "surface-container": "#eeeeee",
              "surface-container-low": "#f3f3f3",
              "surface-container-lowest": "#ffffff",
              "surface-container-high": "#e8e8e8",
              "surface-container-highest": "#e2e2e2",
              "on-background": "#1a1c1c",
              "on-surface": "#1a1c1c",
              "secondary": "#5e5e5e",
              "primary": "#a04100",
              "primary-container": "#ff6b00"
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "9999px"
            },
            spacing: {
              "container-max": "1280px",
              "margin-desktop": "64px",
              "base": "8px",
              "margin-mobile": "20px",
              "gutter-mobile": "16px",
              "gutter-desktop": "24px"
            },
            fontFamily: {
              "display": ["Bebas Neue", "sans-serif"],
              "body": ["Inter", "sans-serif"]
            },
            fontSize: {
              "display-lg-mobile": ["48px", { lineHeight: "48px", letterSpacing: "0.02em", fontWeight: "400" }],
              "display-lg": ["80px", { lineHeight: "80px", letterSpacing: "0.02em", fontWeight: "400" }],
              "headline-lg": ["40px", { lineHeight: "40px", letterSpacing: "0.03em", fontWeight: "400" }],
              "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "700" }],
              "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "label-bold": ["14px", { lineHeight: "20px", fontWeight: "700" }],
              "label-sm": ["12px", { lineHeight: "16px", fontWeight: "500" }]
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <style>
        :root { --bg:#0f0f0f; --card:#1a1a1a; --line:#2c2c2c; --mute:#9a9a9a; }
        body { background: var(--bg); color: #f3f3f3; }
        .titulo { font-family: 'Bebas Neue', sans-serif; letter-spacing: .5px; }
        .campo { width: 100%; min-height: 44px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: #f3f3f3; font-size: 16px; }
        .campo:focus { border-color: #FF6B00; box-shadow: none; }
        .etiqueta { display: block; color: var(--mute); font-size: 12px; margin: 14px 0 6px; }
        .opcion { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; background: transparent; color: #f3f3f3; font-weight: 500; }
        .opcion[aria-pressed="true"] { border-color: #FF6B00; background: rgba(255,107,0,.12); font-weight: 700; }
        .boton { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px; margin-top: 18px; background: #FF6B00; color: #fff; font-weight: 700; border-radius: 12px; padding: 10px; }
        .boton:disabled { opacity: .4; cursor: not-allowed; }
        .boton-sec { background: transparent; border: 1px solid var(--line); color: #f3f3f3; margin-top: 10px; }
        .tarjeta { background: var(--card); border-radius: 12px; padding: 14px; line-height: 1.7; }
        .nota { font-size: 12px; color: var(--mute); line-height: 1.5; margin-top: 10px; }
        .contador { display: flex; align-items: center; justify-content: space-between; background: var(--card); border-radius: 10px; padding: 6px 10px; }
        .contador button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); font-size: 22px; background: transparent; color: #f3f3f3; }
        .contador button:disabled { opacity: .25; cursor: default; }
        .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 14px; }
        .cal .cab { color: var(--mute); font-size: 12px; padding: 4px 0; }
        .cal button { min-height: 44px; border-radius: 8px; background: var(--card); color: #f3f3f3; border: 1px solid transparent; }
        .cal button:disabled { opacity: .3; cursor: default; }
        .cal button[aria-pressed="true"] { background: #FF6B00; font-weight: 700; }
        .navmes { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .navmes button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: #f3f3f3; font-size: 20px; }
        .navmes button:disabled { opacity: .25; cursor: default; }
        .horas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .horas button { min-height: 44px; border-radius: 9px; background: var(--card); border: 1px solid var(--line); color: #f3f3f3; }
        .horas button[aria-pressed="true"] { border-color: #FF6B00; background: rgba(255,107,0,.15); font-weight: 700; }
        .horas button:disabled { opacity: .35; text-decoration: line-through; cursor: default; }
        .error { background: rgba(220,53,69,.15); border: 1px solid rgba(220,53,69,.5); border-radius: 10px; padding: 10px 12px; margin-top: 14px; font-size: 14px; }
        .atras { color: var(--mute); min-height: 44px; padding: 0 4px; font-size: 14px; }
        .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; font-size: 13px; line-height: 1.5; color: #d0d0d0; }
        .check input { width: 22px; height: 22px; margin-top: 1px; flex: none; accent-color: #FF6B00; }
        .check a { color: #FF6B00; text-decoration: underline; }
        .wa { background: #25D366; color: #07240f; }
        .codigo { font-family: 'Bebas Neue', sans-serif; font-size: 40px; letter-spacing: 3px; text-align: center; color: #FF6B00; }
        .icono { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; font-weight: 700; margin: 8px auto; color: #0f0f0f; }
        [hidden] { display: none !important; }
    
    
        body { font-size: 16px; }
        .tab { flex: 1; min-height: 52px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: #f3f3f3; font-weight: 600; font-size: 18px; }
        .tab[aria-pressed="true"] { border-color: #FF6B00; background: rgba(255,107,0,.15); }
        .res { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 12px; }
        .res .hora { font-family: 'Bebas Neue', sans-serif; font-size: 56px; line-height: 1; letter-spacing: 1px; color: #FF6B00; }
        .res .nombre { font-size: 22px; font-weight: 700; }
        .res .dato { font-size: 18px; }
        .res .etq { background: rgba(255,255,255,.1); border-radius: 999px; padding: 2px 12px; font-size: 16px; font-weight: 600; }
        .res .vip { background: #FF6B00; color: #000; }
        .res.llego { border-color: #1ABC9C; }
        .res.no-llego { opacity: .75; border-color: #dc3545; }
        .res.cancelada { opacity: .5; filter: grayscale(1); }
        .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        .acciones button { min-height: 52px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: #f3f3f3; font-weight: 700; font-size: 16px; }
        .acciones .llego[aria-pressed="true"] { background: #1ABC9C; color: #000; border-color: #1ABC9C; }
        .acciones .no[aria-pressed="true"] { background: #dc3545; border-color: #dc3545; }
        .acciones .desc { grid-column: 1 / -1; border-color: #FF6B00; }
        .acciones button:disabled { opacity: .4; cursor: wait; }
        .desc-ok { grid-column: 1 / -1; min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #1ABC9C; color: #000; font-weight: 700; }
        .fecha-h { font-family: 'Bebas Neue', sans-serif; font-size: 32px; margin-top: 24px; letter-spacing: 1px; text-transform: capitalize; }
    </style>
</head>
<body class="font-body">
    <header class="border-b border-white/10 bg-deep-black">
        <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="../../" class="flex items-center gap-3">
                <img src="../../assets/brand/logor.webp" alt="Urban Food" width="227" height="128" class="h-10 w-auto rounded">
                <span class="titulo text-2xl text-vibrant-orange">URBAN FOOD <small class="text-sm text-white/50 font-body tracking-normal">Panel</small></span>
            </a>
            <button type="button" id="salir" class="text-sm text-white/60 min-h-[44px] px-2" hidden>Salir</button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 pt-4 pb-16">
        <section id="pronto" hidden>
            <h1 class="titulo text-3xl mt-4">Reservas en línea</h1>
            <div class="tarjeta mt-3" id="prontoTxt"></div>
            <div id="prontoWa"></div>
        </section>

        <section id="login" hidden>
            <h1 class="titulo text-3xl mt-4">Reservas de la sede</h1>
            <form id="formLogin" novalidate>
                <span class="etiqueta">Sede</span>
                <div class="grid grid-cols-2 gap-2" id="sedes"></div>
                <label class="etiqueta" for="clave">Clave</label>
                <input class="campo" id="clave" type="password" autocomplete="current-password" required>
                <div id="errorLogin" class="error" role="alert" hidden></div>
                <button type="submit" class="boton" id="entrar">Entrar</button>
            </form>
        </section>

        <section id="vista" hidden>
            <div class="flex items-end justify-between gap-2">
                <div>
                    <h1 class="titulo text-4xl" id="tituloSede"></h1>
                    <p class="text-lg text-white/70" id="tituloFecha"></p>
                </div>
                <p class="nota text-right" id="actualizado" aria-live="polite"></p>
            </div>
            <div class="flex gap-2 mt-3" role="group" aria-label="Periodo">
                <button type="button" class="tab" id="tabHoy" aria-pressed="true">Hoy</button>
                <button type="button" class="tab" id="tabProx" aria-pressed="false">Próximos 7 días</button>
            </div>
            <div id="errorVista" class="error" role="alert" hidden></div>
            <div id="lista"></div>
        </section>
    </main>

    <script src="../../assets/js/reservas-comun.js"></script>
    <script src="../../assets/js/panel.js"></script>
</body>
</html>
